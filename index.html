<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenPresets — free, open-source presets for Lightroom</title>
    <meta name="description" content="A free, open-source library of presets for Lightroom. Preview before and after, then download .xmp files. No sign-up." />
    <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const t = localStorage.getItem("op-theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="logo" href="#/" aria-label="OpenPresets home">
          <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
            <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.5" />
            <path d="M16 2a14 14 0 0 1 0 28z" fill="currentColor" />
          </svg>
          <span>OpenPresets</span>
        </a>
        <nav class="nav" aria-label="Main">
          <a href="#/" data-nav="library">Library</a>
          <a href="#/about" data-nav="about">About</a>
          <a id="nav-github" href="#" target="_blank" rel="noopener">GitHub</a>
          <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
          </button>
          <a class="btn btn-coffee" id="nav-donate" href="#" target="_blank" rel="noopener">
            <span aria-hidden="true">☕</span><span class="hide-sm">Buy me a coffee</span>
          </a>
        </nav>
      </div>
    </header>

    <main id="main" class="wrap" tabindex="-1"></main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <p>
          <strong>OpenPresets</strong> · free and open source. Code under MIT, presets under CC0.
        </p>
        <p class="muted small">
          Not affiliated with or endorsed by Adobe. Lightroom is a trademark of Adobe Inc.
        </p>
      </div>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
